pointcloud_to_laserscan:
  ros__parameters:

    use_sim_time: true

    target_frame: lidar_link
    transform_tolerance: 0.05

    # Temiz yatay SLAM dilimi
    min_height: -0.08
    max_height: 0.08

    angle_min: -3.14159265
    angle_max: 3.14159265

    # 180 yatay örnek ~= 2 derece
    angle_increment: 0.0349066

    scan_time: 0.20

    # Robotun çok yakınındaki self-noise'i azalt
    range_min: 0.50

    # Bu parkur için 25-30 m gereksiz
    range_max: 12.0

    use_inf: true
    queue_size: 5