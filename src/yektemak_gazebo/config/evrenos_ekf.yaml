ekf_filter_node:
  ros__parameters:

    use_sim_time: true

    frequency: 50.0
    sensor_timeout: 0.1
    transform_time_offset: 0.05

    # EVRENOS ground vehicle
    two_d_mode: true

    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # ==================================================
    # WHEEL ODOMETRY
    # ==================================================

    odom0: /odom

    # State order:
    # x, y, z,
    # roll, pitch, yaw,
    # vx, vy, vz,
    # vroll, vpitch, vyaw,
    # ax, ay, az

    # Wheel odometry:
    # use forward velocity + yaw velocity
    odom0_config: [
      false, false, false,
      false, false, false,
      true,  false, false,
      false, false, true,
      false, false, false
    ]

    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10


    # ==================================================
    # IMU
    # ==================================================

    imu0: /imu/data

    # Use IMU yaw and yaw angular velocity.
    imu0_config: [
      false, false, false,
      false, false, true,
      false, false, false,
      false, false, true,
      false, false, false
    ]

    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 20
